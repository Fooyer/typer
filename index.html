<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typer</title>
    <style>
      /*
        Inline and dependency-free on purpose: this paints before the browser has even started
        fetching main.tsx's module graph (React, Monaco, the TextMate grammars, ...), which is what
        actually takes long enough to show as a white flash — style.css and App.tsx's own theming
        can't help here since loading *them* is part of that same wait. Removed by main.tsx once
        React has mounted (see the #app-loading removal there).
      */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1e1e1e;
        color: #d4d4d4;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #app-loading .app-loading-spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #d4d4d4;
        animation: app-loading-spin 0.8s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading">
      <div class="app-loading-spinner"></div>
      <div>Carregando…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
